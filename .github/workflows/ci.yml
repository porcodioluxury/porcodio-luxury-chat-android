name: CI (verifica leggera)

# Compila solo il codice Java/Kotlin (senza la parte nativa C++), con cache Gradle.
# L'APK completo e firmato si costruisce con il workflow "Android APK".
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Sottomoduli necessari al solo codice Java
        run: git submodule update --init --depth 1 TMessagesProj/lib/jlatexmath TMessagesProj_Modules/media

      - name: Libera spazio su disco
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/local/graalvm /usr/local/share/powershell /usr/local/share/chromium \
            /usr/lib/google-cloud-sdk /usr/lib/firefox || true
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compila Java (afat debug)
        env:
          # Valori segnaposto: la verifica non usa le chiavi vere (quelle stanno solo nei Secrets del workflow di release).
          TELEGRAM_API_ID: "0"
          TELEGRAM_API_HASH: "ci-placeholder"
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:compileAfatDebugJavaWithJavac -PPORCODIO_ABIS=arm64-v8a --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
